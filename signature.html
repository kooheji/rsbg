<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneScape Banner</title>
  <style>
    :root {
      --w: 100vw;
      --h: 100vh;
      --gold: #ffd56f;
      --gold-deep: #9b6b24;
      --ice: #bcecff;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #banner {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      color: #fff;
      box-sizing: border-box;
      border-radius: 5px;
      border: 2px solid #344e5a;
      background:
        radial-gradient(circle at 72% 14%, rgba(122, 187, 222, 0.34), transparent 27%),
        linear-gradient(90deg, rgba(0, 7, 12, 0.98), rgba(7, 35, 48, 0.9) 42%, rgba(2, 10, 15, 0.97)),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 10px);
      box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.72), inset 0 0 34px rgba(0, 0, 0, 0.94);
    }

    #banner::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(239, 181, 75, 0.72);
      box-shadow: inset 0 0 0 1px rgba(61, 108, 121, 0.58), inset 0 0 22px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    #banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 40%, rgba(255,255,255,0.07) 42%, transparent 48%);
      pointer-events: none;
    }

    #banner.game-osrs {
      --gold: #fff13a;
      --gold-deep: #6f5d35;
      --ice: #f2dfb5;
      border-color: #26231d;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 7px),
        #403b30;
      box-shadow: inset 0 0 0 2px #746d5d, inset 0 0 0 5px #17150f;
    }

    #banner.game-osrs::before {
      inset: 7px;
      border-color: #8e8672;
      box-shadow: inset 0 0 0 1px #26231b;
    }

    .banner-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: 62px 1fr;
      height: 100%;
      padding: 12px 14px 14px;
      box-sizing: border-box;
    }

    .banner-header {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 76px;
      align-items: center;
      gap: 11px;
      min-width: 0;
      border-bottom: 1px solid rgba(0,0,0,0.82);
      box-shadow: 0 1px 0 rgba(88, 137, 149, 0.52);
    }

    .game-osrs .banner-header {
      grid-template-columns: 72px minmax(0, 1fr) 84px;
      border-bottom: 0;
      box-shadow: none;
    }

    .game-logo {
      display: grid;
      place-items: center;
      height: 50px;
      min-width: 0;
    }

    .game-logo img {
      max-width: 78px;
      max-height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px #000) drop-shadow(0 0 6px rgba(255,143,31,0.5));
    }

    .game-osrs .game-logo img {
      max-width: 54px;
      max-height: 54px;
      filter: drop-shadow(0 2px 2px #000);
    }

    .identity {
      min-width: 0;
    }

    #username {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 27px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 0 #000, 0 0 7px rgba(255, 190, 76, 0.45);
    }

    .game-osrs #username {
      color: #ffbb43;
      text-shadow: 2px 2px 0 #15120c;
    }

    .total-line {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
      color: var(--ice);
      font-size: 14px;
      line-height: 16px;
      text-shadow: 0 1px 0 #000;
    }

    .game-osrs .total-line {
      display: inline-flex;
      padding: 4px 10px 5px 5px;
      border: 2px solid #15130e;
      color: #fff1c0;
      background: #302c22;
      box-shadow: none;
      font-size: 14px;
    }

    .total-icon {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(218, 223, 204, 0.62);
      border-radius: 3px;
      background: linear-gradient(145deg, #1c2b31, #071015);
      box-shadow: inset 0 0 7px rgba(255,255,255,0.12), 0 1px 0 #000;
    }

    .game-osrs .total-icon {
      width: 22px;
      height: 22px;
      border-color: #15130e;
      border-radius: 0;
      background: #4a4537;
    }

    .total-icon img {
      width: 17px;
      height: 17px;
      object-fit: contain;
    }

    .banner-cta {
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 74px;
      min-height: 32px;
      padding: 4px 7px;
      border: 1px solid rgba(224, 206, 157, 0.58);
      border-radius: 4px;
      color: #fff0c8;
      background: linear-gradient(145deg, #263940, #081217);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.58), 0 0 10px rgba(0,0,0,0.85);
      font-size: 9px;
      line-height: 10px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: 0 1px 0 #000;
    }

    .game-osrs .banner-cta {
      border: 2px solid #15130e;
      border-radius: 1px;
      color: #ffdf79;
      background: #302c22;
      box-shadow: none;
    }

    .banner-skills {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(5, 1fr);
      gap: 5px 6px;
      margin: 8px 5px 0;
      padding: 0;
      min-height: 0;
    }

    .game-osrs .banner-skills {
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(3, 1fr);
      gap: 7px 8px;
      margin: 10px 8px 0;
    }

    .skill-tile {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 22px 22px;
      grid-template-rows: 1fr;
      align-items: center;
      justify-content: center;
      justify-items: center;
      column-gap: 3px;
      padding: 2px 3px 1px;
      border: 1px solid rgba(127, 154, 158, 0.74);
      border-radius: 3px;
      box-sizing: border-box;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(21, 47, 55, 0.9), rgba(2, 12, 17, 0.96)),
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.13), transparent 44%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.56), inset 0 0 12px rgba(33,87,105,0.42), 0 2px 5px rgba(0,0,0,0.72);
    }

    .skill-tile::before,
    .skill-tile::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      pointer-events: none;
    }

    .skill-tile::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid var(--gold-deep);
      border-left: 1px solid var(--gold-deep);
    }

    .skill-tile::after {
      right: -1px;
      bottom: -1px;
      border-right: 1px solid #536d72;
      border-bottom: 1px solid #536d72;
    }

    .game-osrs .skill-tile {
      grid-template-columns: 22px 21px;
      grid-template-rows: 1fr;
      align-items: center;
      justify-content: center;
      justify-items: center;
      column-gap: 0;
      padding: 4px 5px;
      border: 2px solid #211f18;
      border-radius: 1px;
      background: #514d41;
      box-shadow: none;
    }

    .game-osrs .skill-tile::before,
    .game-osrs .skill-tile::after {
      display: none;
    }

    .skill-icon {
      width: 21px;
      height: 21px;
      object-fit: contain;
      filter: drop-shadow(0 2px 1px #000);
      align-self: center;
    }

    .game-osrs .skill-icon {
      width: 22px;
      height: 22px;
      justify-self: center;
      align-self: center;
      filter: drop-shadow(1px 1px 0 #111);
    }

    .skill-level {
      position: relative;
      z-index: 1;
      display: block;
      min-width: 100%;
      color: var(--gold);
      font-size: 12px;
      line-height: 12px;
      font-weight: 800;
      text-align: left;
      text-shadow: 0 1px 0 #000, 0 0 3px rgba(255,196,77,0.45);
      background: none;
    }

    .game-osrs .skill-level {
      color: #fff12f;
      font-family: Georgia, "Times New Roman", serif;
      min-width: 21px;
      font-size: 12px;
      line-height: 12px;
      text-align: right;
      text-shadow: 1px 1px 0 #111;
      background: none;
    }

    .skill-name,
    .mode-icons .skill-name {
      display: none;
    }

    .template-state {
      display: grid;
      place-items: center;
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      height: 100%;
      color: var(--ice);
      font-size: 16px;
      text-shadow: 0 1px 0 #000;
    }

    #banner.game-osrs {
      border-radius: 14px;
      border: 3px solid #15120d;
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 237, 174, 0.09), transparent 25%),
        repeating-radial-gradient(circle at 11px 9px, rgba(0,0,0,0.26) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, #625d50, #454034 58%, #302b22);
      box-shadow:
        inset 0 0 0 2px #9b927d,
        inset 0 0 0 6px #2b281f,
        inset 0 0 18px rgba(0,0,0,0.48);
    }

    #banner.game-osrs::before {
      inset: 8px;
      border: 2px solid #242016;
      border-radius: 10px;
      box-shadow: inset 1px 1px 0 #817966, inset -1px -1px 0 #252219;
    }

    #banner.game-osrs::after {
      display: none;
    }

    .game-osrs .banner-inner {
      grid-template-rows: 58px 1fr;
      padding: 16px 16px 14px;
    }

    .game-osrs .banner-header {
      grid-template-columns: 54px minmax(0, 1fr) 80px;
      gap: 10px;
      align-items: center;
      border: 0;
    }

    .game-osrs .game-logo {
      height: 52px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .game-osrs .game-logo img {
      max-width: 50px;
      max-height: 50px;
      filter: drop-shadow(2px 2px 0 #111);
    }

    .game-osrs .identity {
      align-self: stretch;
      display: grid;
      align-content: center;
      justify-items: start;
      min-width: 0;
    }

    .game-osrs #username {
      font-family: Georgia, "Times New Roman", serif;
      color: #fff032;
      font-size: 24px;
      line-height: 24px;
      letter-spacing: 0;
      text-shadow: 2px 2px 0 #1a160d, 0 0 2px #000;
    }

    .game-osrs .total-line {
      margin-top: 5px;
      gap: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #fff;
      background: transparent;
      box-shadow: none;
      font-size: 14px;
      line-height: 16px;
      font-weight: 700;
      text-shadow: 2px 2px 0 #14100a;
    }

    .game-osrs .total-icon {
      display: none;
    }

    .game-osrs .total-line strong {
      color: #fff032;
      font-weight: 700;
    }

    .game-osrs .banner-cta {
      width: 80px;
      min-height: 34px;
      padding: 5px 7px;
      border: 2px solid #15130e;
      border-radius: 4px;
      color: #fff032;
      background:
        repeating-radial-gradient(circle at 6px 6px, rgba(0,0,0,0.22) 0 1px, transparent 1px 5px),
        #4b4638;
      box-shadow: inset 1px 1px 0 #746d5d, inset -1px -1px 0 #242016;
      font-size: 10px;
      line-height: 11px;
      letter-spacing: 0.04em;
    }

    .game-osrs .banner-skills {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(5, 1fr);
      gap: 4px 5px;
      margin: 8px 0 0;
    }

    .game-osrs .skill-tile {
      display: grid;
      grid-template-columns: 28px 1fr;
      grid-template-rows: 1fr;
      align-items: center;
      justify-content: center;
      justify-items: center;
      column-gap: 3px;
      padding: 2px 6px 2px 5px;
      border: 1px solid #211f18;
      border-radius: 3px;
      background:
        repeating-radial-gradient(circle at 5px 5px, rgba(0,0,0,0.18) 0 1px, transparent 1px 5px),
        #5a5547;
      box-shadow:
        inset 1px 1px 0 #756e5d,
        inset -1px -1px 0 #312d23;
    }

    .game-osrs .skill-tile::before,
    .game-osrs .skill-tile::after {
      display: none;
    }

    .game-osrs .skill-icon {
      width: 23px;
      height: 23px;
      align-self: center;
      justify-self: center;
      filter: drop-shadow(1px 1px 0 #111);
    }

    .game-osrs .skill-level {
      min-width: 23px;
      color: #fff12f;
      background: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 15px;
      text-align: right;
      text-shadow: 1px 1px 0 #111;
    }
  </style>
</head>
<body>
  <div id="banner">
    <div class="banner-inner">
      <header class="banner-header">
        <div class="game-logo" aria-hidden="true"><img id="gameLogo" src="icons/rs3-logo.png" alt=""></div>
        <div class="identity">
          <h1 id="username"></h1>
          <div class="total-line">
            <span class="total-icon"><img src="icons/overall.png" alt=""></span>
            <span>Total Level: <strong id="totalLevel">...</strong></span>
          </div>
        </div>
        <a class="banner-cta" href="https://rsbg.kooheji.dev" target="_blank" rel="noopener">Get Yours</a>
      </header>
      <ul id="skills" class="banner-skills"></ul>
    </div>
  </div>

  <script src="config.js?v=20260513h"></script>
  <script src="banner.js?v=20260513h"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get("username") || "";
    const game = params.get("game") || "rs3";
    const gradient = params.get("gradient");

    const banner = document.getElementById("banner");
    const skillsList = document.getElementById("skills");
    const gameLogo = document.getElementById("gameLogo");

    banner.classList.add(game === "osrs" ? "game-osrs" : "game-rs3");
    gameLogo.src = game === "osrs" ? "icons/osrs-logo.png" : "icons/rs3-logo.png";
    if (gradient) {
      banner.style.backgroundImage = `linear-gradient(90deg, rgba(0,0,0,0.68), rgba(0,0,0,0.36)), ${gradient}`;
    }

    document.getElementById("username").textContent = username || "Player";
    skillsList.classList.add("mode-icons");
    skillsList.innerHTML = "<li class=\"template-state\">Loading stats...</li>";

    if (!username) {
      document.getElementById("totalLevel").textContent = "-";
      skillsList.innerHTML = "<li class=\"template-state\">Missing username</li>";
    } else {
      fetchHiscores(username, game)
        .then((skills) => {
          const overall = skills.find((skill) => skill.name === "Overall");
          document.getElementById("totalLevel").textContent = overall ? formatLevel(overall.level) : "-";
          renderSkills(skills, skillsList, "icons", game);
        })
        .catch((err) => {
          console.error("Error loading stats:", err);
          document.getElementById("totalLevel").textContent = "-";
          skillsList.innerHTML = "<li class=\"template-state\">Error loading stats</li>";
        });
    }
  </script>
</body>
</html>
